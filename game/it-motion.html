<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>IT救援侠 · 动作样板</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#292439;font-family:"PingFang SC",system-ui,sans-serif}body{display:grid;place-items:center}#stage{position:relative;width:min(100vw,56.25dvh);height:min(100dvh,177.778vw);overflow:hidden;background:#d7a47c;touch-action:none}canvas{display:block;width:100%;height:100%}#bubble{position:absolute;left:50%;top:27%;transform:translate(-50%,-100%);border:2px solid #6b4550;border-radius:15px;background:#fff1d6;padding:10px 14px;font-size:14px;font-weight:700;color:#503b48;white-space:nowrap;box-shadow:0 4px 12px #4a293333}#bubble:empty{display:none}#bubble:after{content:'';position:absolute;bottom:-7px;left:47%;width:10px;height:10px;transform:rotate(45deg);border-right:2px solid #6b4550;border-bottom:2px solid #6b4550;background:#fff1d6}nav{position:absolute;bottom:5%;left:7%;right:7%;display:flex;gap:10px}button{flex:1;border:1px solid #f8d3a6;border-radius:16px;padding:15px 7px;color:#fff1da;background:#5c4054e8;font:700 16px inherit;cursor:pointer;box-shadow:0 4px 0 #33263e66}button:active{transform:translateY(2px)}button:disabled{opacity:.5}#load{position:absolute;top:5%;left:0;right:0;text-align:center;font-size:13px;color:#fff5d8;text-shadow:0 1px 3px #382636}#note{position:absolute;bottom:1.8%;left:0;right:0;color:#fff0d6;text-align:center;font-size:11px}#qa{position:absolute;right:4px;top:7px;background:#fff9dfdd;border-radius:8px;padding:8px;font:10px monospace;color:#3e3545;white-space:pre;pointer-events:none}#qa[hidden]{display:none}a{color:inherit}
</style></head><body><main id="stage"><canvas id="scene" aria-label="IT救援侠独立动作样板"></canvas><div id="load">正在准备 IT 救援侠…</div><div id="bubble" role="status"></div><nav><button id="reward" disabled>🍫 投喂</button><button id="hammer" disabled>🔨 敲击</button></nav><div id="note">点击道具，观看完整回应</div><output id="qa" hidden></output></main><script type="module" src="/src/it-motion-lab.js"></script></body></html>
