<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f5ecdd"><meta name="description" content="摸鱼事务所：敲走怨气，喂点快乐。30秒摸鱼挑战，或找一位办公室同事聊两句。"><title>摸鱼事务所 · 敲走怨气，喂点快乐</title></head><body>
<main id="app">
 <header class="header"><div class="eyebrow"><span class="live-dot"></span> OFFICE ESCAPE <span>VOL. 01</span></div><div class="brand-row"><div><h1>摸鱼<span>事务所</span><i>!</i></h1><p id="subtitle">锤走加班，投喂同盟。</p></div><button id="mute" class="icon-button" aria-label="静音" title="静音">♫</button></div></header>
 <section id="hud" class="hud" aria-label="对局状态">
  <div class="score-wrap"><canvas class="hud-fish" data-hud-icon="fish" aria-hidden="true"></canvas><small>摸鱼积分</small><span class="hud-value"><canvas data-hud-icon="watch" aria-hidden="true"></canvas><strong id="score">000</strong></span><canvas class="hud-star" data-hud-icon="star" aria-hidden="true"></canvas></div>
  <div class="timer-wrap"><small>TIME</small><span class="hud-value"><canvas data-hud-icon="watch" aria-hidden="true"></canvas><span id="time">30</span></span></div>
  <div class="combo-wrap"><small>连击</small><span class="hud-value"><canvas data-hud-icon="flame" aria-hidden="true"></canvas><strong id="combo">×0</strong></span></div>
  <div class="time-track"><i id="timebar"></i></div>
 </section>
 <section id="field" aria-label="办公室游戏区域"><canvas id="scene" aria-label="十个工位的3D办公室"></canvas><div id="labels"></div><div id="floats"></div><div id="countdown" class="countdown" hidden>3</div><div id="phase" class="phase" hidden>上班时间 · 慢慢来</div></section>
 <button id="pause" aria-label="暂停" class="pause-button"><canvas data-hud-icon="pause" aria-hidden="true"></canvas></button><div class="top-actions"><button id="guide" aria-label="人物图鉴">人物</button><button id="credits" aria-label="音乐设置">音乐</button></div><section id="tool-tray" aria-label="选择道具"><button id="chocolate-select" class="tool-select selected" aria-pressed="true"><span>投喂</span><small>投喂同盟</small></button><button id="hammer-select" class="tool-select" aria-pressed="false"><span>敲击</span><small>锤走加班</small></button></section><p id="selected-hint">投喂冒头的人物</p><footer id="controls"><div id="home-controls"><div class="howto"><span><b>↘</b> 点一下 <em>锤走坏老板</em></span><i></i><span><b>↑</b> 向上滑 <em>投喂好同事</em></span></div><div class="start-row"><button id="practice" class="primary">摸鱼</button><button id="private-start" class="primary">私聊</button><button id="start" class="round-button">30秒挑战</button></div><div class="bottom-links"><span id="load-status">正在布置办公室…</span></div></div><div id="play-controls" hidden><div id="feedback" role="status">人物冒头时，点道具直接出手</div><button id="restart" class="text-button">重新开始</button></div></footer>
 <section id="results" class="modal" hidden role="dialog" aria-modal="true" aria-label="对局结算"><div class="result-card"><div class="result-stamp">打卡成功 · 下班快乐</div><div class="result-mouse">🐭</div><p>今日摸鱼成就</p><h2 id="rank"></h2><div class="result-score" id="final-score">0</div><span class="score-unit">摸鱼积分</span><div class="stats"><div><b id="accuracy">0%</b><small>操作正确率</small></div><div><b id="best-combo">0</b><small>最高连击</small></div><div><b id="hits">0</b><small>成功互动</small></div></div><p id="result-note" class="result-note" role="status" aria-live="polite" aria-busy="false"></p><button id="again" class="primary">再摸一局 <span>↻</span></button><button id="back-home" class="text-button">返回首页</button></div></section>
 <section id="guide-modal" class="modal" hidden role="dialog" aria-modal="true" aria-label="人物图鉴"><div class="guide-card"><div class="guide-heading"><div><small>YOUR OFFICE PEOPLE</small><h2>办公室众生相</h2></div><button id="close-guide" class="icon-button" aria-label="关闭人物图鉴">×</button></div><p id="customization-status" role="status">轻点人物文字或亲疏值，即可修改。</p><div id="roster"></div></div></section>
 <section id="credits-modal" class="modal" hidden role="dialog" aria-modal="true" aria-label="音乐设置"><div class="guide-card"><div class="guide-heading"><h2>音乐设置</h2><button id="close-credits" class="icon-button" aria-label="关闭音乐设置">×</button></div></div></section><section id="pause-modal" class="modal" hidden role="dialog" aria-modal="true" aria-label="暂停菜单"><div class="pause-card"><button id="resume" class="primary">继续</button><button id="menu-mute">关闭声音</button><button id="menu-guide">人物图鉴</button></div></section><div id="fatal" hidden>浏览器暂不支持3D，请使用新版 Safari 或 Chrome 打开。</div>
</main><script type="module" src="/src/main.js"></script></body></html>
